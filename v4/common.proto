syntax = "proto3";

package planx.plugin.v4;

option go_package = "github.com/planx-lab/planx-proto/gen/go/planx/plugin/v4;pluginv4";

// ----------------------------
// Common Runtime Messages
// ----------------------------

message Empty {}

message SessionCreateRequest {
  string tenant_id = 1;
  bytes config     = 2; // opaque plugin config
}

message SessionCreateResponse {
  string session_id = 1;
}

message SessionCloseRequest {
  string session_id = 1;
}

// ----------------------------
// Flow Control
// ----------------------------

message StreamOpenRequest {
  string session_id = 1;
  int32  initial_window = 2;
}

message AckRequest {
  string session_id = 1;
  int32  processed = 2;
  int32  new_window = 3;
}

message AckResponse {}

// ----------------------------
// Batch Transport
// ----------------------------

message Batch {
  bytes payload = 1; // opaque, codec-defined
}
