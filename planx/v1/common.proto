syntax = "proto3";

package planx.v1;

option go_package = "github.com/planx-lab/planx-proto/gen/go/planx/v1;planxv1";

// Empty message for RPCs that don't need a response body
message Empty {}

// =============================================================================
// Data Model
// =============================================================================

// Record represents a single data record in the pipeline.
// Payload MUST remain opaque binary - Engine MUST NOT parse it.
message Record {
    map<string, string> metadata = 1;
    bytes payload = 2;  // opaque binary (zero-copy)
}

// Batch represents a collection of records for batch transport.
// All transport MUST use Batch - no single-record transport allowed.
message Batch {
    repeated Record records = 1;
    map<string, string> context = 2;
}

// BatchRequest wraps a packed batch for streaming transport.
message BatchRequest {
    string session_id = 1;
    bytes packed_batch = 2;  // zero-copy packed format
}

// BatchResponse wraps a packed batch response.
message BatchResponse {
    bytes packed_batch = 1;  // zero-copy packed format
}

// =============================================================================
// Session Management (Shared by all plugin types)
// =============================================================================

// SessionCreateRequest initializes a new session on a plugin.
message SessionCreateRequest {
    string tenant_id = 1;
    bytes config_json = 2;
}

// SessionCreateResponse returns the created session ID.
message SessionCreateResponse {
    string session_id = 1;
}

// SessionCloseRequest terminates a session.
message SessionCloseRequest {
    string session_id = 1;
}

// =============================================================================
// Flow Control (Backpressure)
// =============================================================================

// StreamOpenRequest opens a stream with initial window size.
message StreamOpenRequest {
    string session_id = 1;
    int32 window_size = 2;
}

// AckRequest acknowledges processed batches and updates window.
message AckRequest {
    string session_id = 1;
    int32 processed = 2;    // number of batches processed
    int32 new_window = 3;   // updated window size
}

// AckResponse confirms the acknowledgment.
message AckResponse {
    bool success = 1;
    string error = 2;
}
